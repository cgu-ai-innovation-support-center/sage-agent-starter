name: Maintainer lightweight check

on:
  pull_request:

permissions:
  contents: read

jobs:
  starter-lightweight:
    if: github.repository == 'cgu-ai-innovation-support-center/sage-agent-starter' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      - name: Use pinned Python runtime
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.12
      - name: Run maintainer-only lightweight gate
        run: npm run test:light
